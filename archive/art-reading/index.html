<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ART READING</title>
<style>
:root{--bg:#f7f7f4;--fg:#111;--muted:#8a8a84;--line:#d7d7d0;--pad:clamp(20px,5vw,38px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Futura,"Avenir Next","Helvetica Neue",Arial,"Noto Sans JP",sans-serif}
body{min-height:100dvh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{width:min(100%,680px);min-height:100dvh;margin:0 auto;padding:18px var(--pad) 34px}
.topbar{height:40px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-size:11px;font-weight:700;letter-spacing:.16em}
.text-btn{border:0;background:transparent;color:var(--muted);font-size:11px;letter-spacing:.08em;padding:10px 0}
.screen{display:none;min-height:calc(100dvh - 92px);flex-direction:column}
.screen.active{display:flex}
.start-center{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.plus{font-size:72px;font-weight:200;line-height:1}
.capture-label{display:inline-flex;flex-direction:column;align-items:center;gap:14px;color:var(--fg);text-decoration:none;font-size:15px}
.photo-frame,.mini-photo{background:#ededE8;overflow:hidden}
.photo-frame{height:72dvh;max-height:760px}
.photo-frame img,.mini-photo img,.result-photo{width:100%;height:100%;object-fit:contain;display:block}
.mini-photo{height:32dvh;min-height:190px;max-height:300px;margin-bottom:34px}
.step{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin:0 0 18px}
h1,h2{margin:0;font-weight:500;letter-spacing:-.035em}
h2{font-size:clamp(28px,7vw,40px);line-height:1.32}
.title-input,textarea{width:100%;border:0;border-bottom:1px solid var(--fg);border-radius:0;background:transparent;color:var(--fg);outline:none;padding:18px 0;font-size:22px;margin-top:26px}
textarea{min-height:120px;resize:none;font-size:18px;line-height:1.7}
.primary,.secondary,.upload-label{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:0;border:1px solid var(--fg);font-weight:600;text-decoration:none}
.primary{background:var(--fg);color:white}
.secondary{background:transparent;color:var(--fg)}
.primary:disabled{opacity:.24;cursor:not-allowed}
.actions{margin-top:auto;padding-top:28px;display:flex;gap:12px}
.actions.two>*{flex:1}
.actions.stacked{flex-direction:column}
.next-single{margin-top:auto;padding-top:30px}
.finish{align-self:center}
.progress{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--muted);margin-bottom:22px}
.progress-line{height:1px;background:var(--line);flex:1;overflow:hidden}
.progress-line i{display:block;height:100%;width:25%;background:var(--fg);transition:width .2s ease}
.choice-grid{display:grid;gap:10px;margin-top:24px}
.choice{min-height:56px;border:1px solid var(--line);background:transparent;text-align:left;padding:0 18px}
.choice.selected{background:var(--fg);border-color:var(--fg);color:#fff}
.result-wrap{background:#fff}
.result-photo{height:min(55dvh,520px);background:#ecece7}
.result-body{padding:34px 24px 26px}
.result-body h2{font-size:32px;margin-bottom:24px}
.result-body p{font-family:"Noto Serif JP","Yu Mincho",serif;white-space:pre-wrap;font-size:15px;line-height:2.05;margin:0 0 30px}
.result-date{text-align:right;color:var(--muted);font-size:10px;letter-spacing:.08em}
@media(min-width:700px){.app{padding-top:24px}.mini-photo{height:280px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand">ART READING</div>
  <button class="text-btn" id="resetBtn" type="button">RESET</button>
</header>

<section class="screen active" data-screen="start">
  <div class="start-center">
    <label class="capture-label">
      <span class="plus">＋</span>
      <span>作品を撮る</span>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
    </label>
  </div>
</section>

<section class="screen" data-screen="photo">
  <div class="photo-frame"><img id="photoPreview" alt="作品"></div>
  <div class="actions two">
    <label class="secondary upload-label">撮り直す<input id="photoRetake" type="file" accept="image/*" capture="environment" hidden></label>
    <button class="primary" id="photoOk" type="button">次へ →</button>
  </div>
</section>

<section class="screen" data-screen="title">
  <div class="mini-photo"><img id="titlePhoto" alt="作品"></div>
  <p class="step">TITLE</p>
  <h2>この作品に<br>タイトルを付ける</h2>
  <input class="title-input" id="titleInput" maxlength="60" autocomplete="off">
  <button class="primary next-single" id="titleNext" type="button" disabled>次へ →</button>
</section>

<section class="screen" data-screen="question">
  <div class="progress"><span id="progressText">01 / 04</span><span class="progress-line"><i id="progressBar"></i></span></div>
  <div class="mini-photo"><img id="questionPhoto" alt="作品"></div>
  <h2 id="questionText"></h2>
  <div id="answerArea"></div>
  <div class="actions stacked">
    <button class="primary" id="answerNext" type="button" disabled>次へ →</button>
    <button class="text-btn finish" id="finishEarly" type="button">ここで終わる</button>
  </div>
</section>

<section class="screen" data-screen="result">
  <article class="result-wrap">
    <img class="result-photo" id="resultPhoto" alt="作品">
    <div class="result-body">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="result-date" id="resultDate"></div>
    </div>
  </article>
  <div class="actions stacked">
    <button class="primary" id="saveBtn" type="button">保存</button>
    <button class="secondary" id="againBtn" type="button">もう一度</button>
  </div>
</section>
</main>

<canvas id="exportCanvas" hidden></canvas>

<script>
const screens=[...document.querySelectorAll('.screen')];
const state={photoData:'',title:'',answers:[],questions:[]};
const questionPools=[
  [
    title=>`「${title}」と付けたのは、どこを見てそう感じた？`,
    title=>`「${title}」の中で、一番気になる部分はどこ？`,
    title=>`最初の3秒で、何が「${title}」につながった？`,
    title=>`この作品のどこに「${title}」を感じた？`
  ],
  [
    title=>`「${title}」は、好き・嫌いで言うとどちらに近い？`,
    title=>`「${title}」を見ていると、心地いい？ それとも落ち着かない？`,
    title=>`この「${title}」に、近づきたい？ 離れたい？`,
    title=>`「${title}」をもう少し見ていたい？`
  ],
  [
    (title,prev)=>prev ? `さっきの「${prev}」から考えると、この「${title}」では何が起きている？` : `この「${title}」では、何が起きていると思う？`,
    title=>`「${title}」の直前に、何があったと思う？`,
    title=>`この「${title}」のあと、何が起きそう？`,
    title=>`「${title}」に登場人物がいるとしたら、何をしている？`
  ],
  [
    title=>`「${title}」を見て、何を思い出した？`,
    title=>`この「${title}」から、どんな場所を思い浮かべる？`,
    title=>`「${title}」に似た感覚を、どこかで味わったことはある？`,
    title=>`この「${title}」から、誰か・何かを連想する？`
  ]
];
const questionTypes=['text','feeling','text','text'];
let qi=0;
const $=id=>document.getElementById(id);

function show(name){
  screens.forEach(s=>s.classList.toggle('active',s.dataset.screen===name));
  window.scrollTo(0,0);
}
function setPhotos(src){
  ['photoPreview','titlePhoto','questionPhoto','resultPhoto'].forEach(id=>$(id).src=src);
}
function reset(){
  state.photoData=''; state.title=''; state.answers=[]; state.questions=[]; qi=0;
  $('titleInput').value=''; $('titleNext').disabled=true; show('start');
}
function handlePhoto(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{state.photoData=e.target.result;setPhotos(state.photoData);show('photo')};
  reader.readAsDataURL(file);
}

$('photoInput').addEventListener('change',e=>handlePhoto(e.target.files[0]));
$('photoRetake').addEventListener('change',e=>handlePhoto(e.target.files[0]));
$('photoOk').onclick=()=>show('title');
$('resetBtn').onclick=reset;

$('titleInput').addEventListener('input',e=>$('titleNext').disabled=!e.target.value.trim());
$('titleNext').onclick=()=>{
  state.title=$('titleInput').value.trim();
  state.questions=[]; qi=0; renderQuestion(); show('question');
};

function pickQuestion(index){
  if(state.questions[index]) return state.questions[index];
  const pool=questionPools[index];
  const prev=index>0 ? (state.answers[index-1]?.text || state.answers[index-1]?.choice || '') : '';
  const fn=pool[Math.floor(Math.random()*pool.length)];
  const q={text:fn(state.title,prev),type:questionTypes[index]};
  state.questions[index]=q;
  return q;
}
function renderQuestion(){
  const q=pickQuestion(qi);
  $('progressText').textContent=String(qi+1).padStart(2,'0')+' / 04';
  $('progressBar').style.width=((qi+1)*25)+'%';
  $('questionText').textContent=q.text;
  $('answerNext').textContent=qi===3?'完成する':'次へ →';
  $('answerNext').disabled=true;
  const area=$('answerArea'); area.innerHTML='';

  if(q.type==='text'){
    const ta=document.createElement('textarea');
    ta.value=state.answers[qi]?.text||'';
    ta.addEventListener('input',()=>{$('answerNext').disabled=!ta.value.trim()});
    area.appendChild(ta);
    if(ta.value.trim())$('answerNext').disabled=false;
  }else{
    const grid=document.createElement('div'); grid.className='choice-grid';
    ['好き','どちらでもない','嫌い'].forEach(v=>{
      const b=document.createElement('button');
      b.type='button'; b.className='choice'; b.textContent=v;
      if(state.answers[qi]?.choice===v)b.classList.add('selected');
      b.onclick=()=>{
        grid.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        $('answerNext').disabled=false;
      };
      grid.appendChild(b);
    });
    area.appendChild(grid);
    if(state.answers[qi]?.choice)$('answerNext').disabled=false;
  }
}

function captureAnswer(){
  const q=pickQuestion(qi),area=$('answerArea');
  if(q.type==='text'){
    state.answers[qi]={text:area.querySelector('textarea').value.trim()};
  }else{
    state.answers[qi]={choice:area.querySelector('.choice.selected')?.textContent||''};
  }
}
$('answerNext').onclick=()=>{
  captureAnswer();
  if(qi<3){qi++;renderQuestion()}else finish();
};
$('finishEarly').onclick=()=>{
  if(!$('answerNext').disabled)captureAnswer();
  finish();
};

function buildText(){
  const a=state.answers,lines=[];
  if(a[0]?.text)lines.push('最初に目に入ったのは、'+a[0].text+'。');
  if(a[1]?.choice)lines.push('好き・嫌いで言えば「'+a[1].choice+'」に近い。');
  if(a[2]?.text)lines.push('私には、'+a[2].text+'ように見える。');
  if(a[3]?.text)lines.push('そこから思い出したのは、'+a[3].text+'。');
  if(!lines.length)lines.push('この作品を見た瞬間に浮かんだものを、そのまま残した。');
  return lines.join('\n\n');
}
function finish(){
  $('resultTitle').textContent=state.title;
  $('resultText').textContent=buildText();
  $('resultDate').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  show('result');
}
$('againBtn').onclick=reset;

$('saveBtn').onclick=()=>{
  const img=new Image();
  img.onload=()=>{
    const c=$('exportCanvas'),ctx=c.getContext('2d');
    const W=1400,photoH=980,pad=90;
    c.width=W;c.height=1900;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,c.height);
    const scale=Math.min(W/img.width,photoH/img.height),dw=img.width*scale,dh=img.height*scale;
    ctx.fillStyle='#eee';ctx.fillRect(0,0,W,photoH);
    ctx.drawImage(img,(W-dw)/2,(photoH-dh)/2,dw,dh);
    ctx.fillStyle='#111';ctx.font='500 58px Arial';
    wrap(ctx,state.title,pad,1095,W-pad*2,74);
    ctx.font='30px serif';
    let y=1280;
    buildText().split('\n').forEach(line=>{if(line===''){y+=30}else{y=wrap(ctx,line,pad,y,W-pad*2,52)+14}});
    ctx.fillStyle='#777';ctx.font='18px Arial';ctx.textAlign='right';
    ctx.fillText($('resultDate').textContent,W-pad,1810);ctx.textAlign='left';
    const a=document.createElement('a');a.download='art-reading.png';a.href=c.toDataURL('image/png');a.click();
  };
  img.src=state.photoData;
};
function wrap(ctx,text,x,y,maxWidth,lineHeight){
  let line='';
  for(const ch of [...text]){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=ch;y+=lineHeight}
    else line=test;
  }
  if(line)ctx.fillText(line,x,y);
  return y;
}
</script>
</body>
</html>
