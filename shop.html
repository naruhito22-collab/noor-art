</style></head><body><header><strong>NOOR</strong><nav><a href="./index.html">OFFICIAL SITE</a></nav></header><main class="wrap"><section class="hero"><div class="eyebrow">BETWEEN — Relations, Defined.</div><h1>COLLECTION</h1><p class="muted">関係を定義する。形が生まれる。</p><p class="small">税込価格・日本国内送料無料｜展示作品は展示終了後に発送します。</p></section><section><h2>WORKS</h2><p class="muted">全18作品の掲載準備中です。以下は商品登録用の仮データで、作品画像・タイトル・在庫は未登録です。</p><div class="grid" id="works"></div></section><section class="cart-items"><h2>CART</h2><div id="items" aria-live="polite">カートは空です。</div><p id="notice" class="small">2点以上の購入は1点あたり10,000円（税込）。国内送料無料。</p></section></main><div class="cart"><div><strong id="total">0点｜0円</strong><div class="small muted">展示終了後発送・国内送料無料</div></div><button id="checkout" disabled>決済準備中（Stripe未接続）</button></div><footer class="footer">NOOR © 2026 · <a href="./index.html">OFFICIAL SITE</a><p class="small">これは非公開制作ブランチの試作です。購入・決済はできません。</p></footer><script>
const series=['Circuit','Field','Flow','Structure','Morphology','Dimension'];const products=series.flatMap(s=>[1,2,3].map(n=>({id:s+'-'+String(n).padStart(2,'0'),series:s})));const cart=new Set();const yen=n=>n.toLocaleString('ja-JP')+'円';function render(){document.getElementById('works').innerHTML=products.map(p=>'<article class="work"><div class="art"><span>IMAGE PENDING</span></div><p>'+p.series+'</p><h3>'+p.id+'</h3><p>作品情報は登録準備中</p><div class="price">12,000円（税込）</div><button data-id="'+p.id+'">'+(cart.has(p.id)?'カートから外す':'カートに追加')+'</button></article>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{cart.has(b.dataset.id)?cart.delete(b.dataset.id):cart.add(b.dataset.id);render()});const count=cart.size;const total=count*(count>=2?10000:12000);document.getElementById('total').textContent=count+'点｜'+yen(total);document.getElementById('items').innerHTML=count?[...cart].map(id=>'<div class="cart-line"><span>'+id+'</span><button data-remove="'+id+'">削除</button></div>').join(''):'カートは空です。';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.delete(b.dataset.remove);render()})}render();
